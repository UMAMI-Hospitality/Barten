:root{
  --bg:#0E0D0C; --surf:#1A1817; --surf2:#232120; --surf3:#2C2927;
  --line:#302C29; --line2:#453F3A;
  --gold:#E9A73C; --gold2:#F3C87A; --goldink:#221904;
  --text:#F4EFE8; --mute:#9C948B; --mute2:#6F675F;
  --disp:'Cormorant Sub','Cormorant Garamond',Georgia,'Times New Roman',serif;
  --ui:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,'Roboto Mono',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font-family:inherit;font-size:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.plate{position:relative;border-radius:50%;overflow:hidden;flex:0 0 auto;
  background:radial-gradient(circle at 32% 28%,#3A342E,#1B1917 70%);
  display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px var(--line2),0 12px 30px rgba(0,0,0,.5)}
.plate img{width:100%;height:100%;object-fit:cover;display:block}
.plate .init{font-family:var(--disp);font-weight:600;color:var(--gold);opacity:.72}

/* login */
#login{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 24px;text-align:center;opacity:0;transition:opacity .18s}
#login.show{opacity:1}
.crest{width:min(250px,66vw);height:auto;display:block;margin:0 auto 20px}
.logo-word{height:26px;width:auto;display:block;flex:1;object-fit:contain;object-position:left center;min-width:0}
.brandsub{font-size:9.5px;letter-spacing:.34em;color:var(--mute);margin:0 0 30px;text-transform:uppercase}
.loginbox{width:100%;max-width:320px}
.inp{width:100%;padding:15px 17px;background:var(--surf);border:1px solid var(--line);border-radius:14px;color:var(--text);font-size:15px;margin-bottom:10px}
.inp::placeholder{color:var(--mute2)}
.pill{display:block;width:100%;padding:15px;background:var(--gold);color:var(--goldink);border-radius:999px;font-weight:700;font-size:14px;margin-top:8px}
.pill:hover:not([disabled]){filter:brightness(1.08)}
.pill[disabled]{opacity:.45;cursor:default}
.err{color:#F08C79;font-size:13px;min-height:19px;margin-top:12px}
.hint{color:var(--mute2);font-size:11.5px;margin-top:18px;font-family:var(--mono)}

/* chrome */
#app{display:none;min-height:100dvh;flex-direction:column}
header{position:sticky;top:0;z-index:40;background:rgba(14,13,12,.93);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  padding:calc(11px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 10px
          calc(16px + env(safe-area-inset-left))}
.htop{display:flex;align-items:center;gap:12px}

.avatar{width:42px;height:42px;border-radius:50%;background:var(--surf2);border:1px solid var(--line2);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--gold);flex:0 0 auto}
.avatar:hover{border-color:var(--gold)}
.menubg{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.55);display:none}
.menubg.on{display:block}
.htop{position:relative}
.menu{position:absolute;right:0;top:40px;z-index:60;background:var(--surf2);border:1px solid var(--line2);
  border-radius:16px;padding:8px;min-width:190px;box-shadow:0 18px 40px rgba(0,0,0,.55);display:none}
.menu.on{display:block}
.menu .who{padding:9px 12px 11px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--mute)}
.menu .who b{display:block;color:var(--text);font-size:15px;font-weight:500;margin-bottom:1px}
.menu button{display:block;width:100%;text-align:left;padding:13px 14px;border-radius:12px;font-size:15px;margin-top:6px}
@media(max-width:620px){
  /* thumb reach: the sheet comes up from the bottom, not the corner */
  .menu{position:fixed;top:auto;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));
    border-radius:22px;padding:10px;min-width:0}
  .menu .who{padding:13px 14px 14px;font-size:13.5px}
  .menu button{padding:17px 15px;font-size:16px;text-align:center;border-radius:15px}
}
.menu button:hover{background:var(--surf3)}
.menu .out{color:#E88A79}
.allerg{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.al{font-size:10.5px;letter-spacing:.06em;font-weight:700;padding:4px 10px;border-radius:999px;
  background:rgba(216,88,63,.16);color:#E88A79;text-transform:uppercase}
.al.none{background:var(--surf2);color:var(--mute2);font-weight:500;letter-spacing:.04em}
.scaler{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:13px;padding-bottom:13px;
  border-bottom:1px solid var(--line)}
.sb{padding:8px 15px;border-radius:999px;background:var(--surf2);border:1px solid var(--line);
  color:var(--mute);font-size:13px;font-weight:600}
.sb.on{background:var(--gold);color:var(--goldink);border-color:var(--gold)}
.sci{width:92px;padding:8px 11px;border-radius:999px;background:var(--surf2);border:1px solid var(--line);
  color:var(--text);font-size:13px;font-family:var(--mono)}
.steps{margin:0;padding-left:22px}
.steps li{padding:8px 0 8px 4px;font-size:14.5px;line-height:1.5;border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:0}
.steps li::marker{color:var(--gold);font-weight:700;font-family:var(--mono);font-size:12.5px}
.fset{margin-top:15px;padding-top:15px;border-top:1px solid var(--line)}
.fset label{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);
  font-weight:700;margin:16px 0 7px}
.fset label.first{margin-top:0}
.tx.w{width:100%}
textarea.tx{resize:vertical;line-height:1.5}
.hint2{font-size:11.5px;color:var(--mute2);margin-top:6px;line-height:1.45}
.ing.confirmrow{gap:8px;flex-wrap:wrap;background:rgba(216,88,63,.10);border-radius:12px;padding:11px 12px;
  border-bottom:0;margin:5px 0}
.ing.confirmrow .n{color:#E88A79;font-size:14px}
.dangerbox{margin-top:12px;background:rgba(216,88,63,.10);border:1px solid rgba(216,88,63,.32);
  border-radius:13px;padding:12px 14px;font-size:13px;color:#EDA898;line-height:1.5}
.sugbox{margin-top:9px;background:rgba(233,167,60,.08);border:1px solid rgba(233,167,60,.26);
  border-radius:13px;padding:11px 13px;font-size:12.5px;color:#E4CFA6;line-height:1.5}
.addbox{margin-top:16px;padding-top:15px;border-top:1px solid var(--line)}
.picklist{max-height:210px;overflow-y:auto;margin-top:9px;border:1px solid var(--line);border-radius:13px;
  background:var(--bg)}
.pick{display:block;width:100%;text-align:left;padding:10px 13px;font-size:14px;border-bottom:1px solid var(--line)}
.pick:last-child{border-bottom:0}
.pick:hover{background:var(--surf2)}
.pick.on{background:rgba(233,167,60,.14);color:var(--gold);font-weight:500}
.pick small{display:block;font-size:10.5px;color:var(--mute2);letter-spacing:.1em;text-transform:uppercase;
  font-weight:700;margin-top:2px}
.pick.new{color:var(--gold)}
.picknone{padding:14px;color:var(--mute2);font-size:13px;text-align:center}
.gpill[disabled]{opacity:.4;cursor:not-allowed}
.segs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:10px}
.segs::-webkit-scrollbar{display:none}
.seg{padding:8px 15px;border-radius:999px;background:var(--surf);color:var(--mute);font-size:13px;font-weight:500;white-space:nowrap}
.seg.on{background:var(--gold);color:var(--goldink);font-weight:700}
main{flex:1;width:100%;max-width:640px;margin:0 auto;
  padding:18px 16px calc(76px + env(safe-area-inset-bottom))}

/* search */
.srow{display:flex;gap:8px;margin-bottom:12px}
.srow .inp{margin:0;border-radius:999px;padding:13px 18px}
.sel{padding:13px 14px;background:var(--surf);border:1px solid var(--line);border-radius:999px;color:var(--text);font-size:13px;max-width:47%}
.quick{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px;padding-bottom:2px}
.quick::-webkit-scrollbar{display:none}
.qb{padding:7px 13px;border-radius:999px;background:var(--surf);border:1px solid var(--line);color:var(--mute);font-size:12.5px;white-space:nowrap}
.qb.on{border-color:var(--gold);color:var(--gold)}
.count{font-family:var(--mono);font-size:11px;color:var(--mute2);letter-spacing:.06em;margin-bottom:11px;text-transform:uppercase}

/* list */
.list{display:flex;flex-direction:column;gap:9px}
.item{display:flex;align-items:center;gap:14px;background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:11px 15px 11px 11px;text-align:left;width:100%;transition:background .14s,border-color .14s}
.item:hover{background:var(--surf2);border-color:var(--line2)}
.item .plate{width:62px;height:62px}
.item .plate .init{font-size:21px}
.item .body{flex:1;min-width:0}
.item .nm{font-family:var(--disp);font-size:21px;font-weight:600;line-height:1.15;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .sub{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.chip{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surf3);color:var(--mute)}
.chip.g{background:rgba(233,167,60,.15);color:var(--gold)}
.chip.live{background:rgba(233,167,60,.15);color:var(--gold)}
.hit{font-size:11.5px;color:var(--gold);font-family:var(--mono);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{color:var(--mute2);font-size:18px;flex:0 0 auto}
.empty{color:var(--mute);padding:52px 10px;text-align:center}
.acct{margin-top:26px;padding-top:20px;border-top:1px solid var(--line);text-align:center}
.who2{font-size:13px;color:var(--mute);margin-bottom:12px}
.who2 b{color:var(--text);font-weight:500}
.signout{width:100%;max-width:280px;padding:15px;border-radius:999px;background:var(--surf);
  border:1px solid var(--line2);color:var(--text);font-size:15px;font-weight:500}
.signout:hover{border-color:var(--gold);color:var(--gold)}

/* detail */
.hero{text-align:center;padding:6px 0 20px}
.hero .plate{width:186px;height:186px;margin:0 auto 18px}
.hero .plate .init{font-size:60px}
.hero h2{font-family:var(--disp);font-size:34px;font-weight:600;line-height:1.1;margin:0 0 10px}
.hero .meta{font-size:12.5px;color:var(--mute);display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center}
.back{color:var(--mute);font-size:13px;margin-bottom:12px;display:inline-flex;gap:7px;align-items:center;padding:6px 12px 6px 8px;border-radius:999px;background:var(--surf)}
.back:hover{color:var(--text);background:var(--surf2)}
.card{background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:16px 17px;margin-bottom:11px}
.ch{font-size:10px;letter-spacing:.19em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:4px}
.chn{font-size:11.5px;color:var(--mute2);margin-bottom:12px}
.ing{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.ing:last-child{border-bottom:0}
.ing .n{flex:1;min-width:0;font-size:15px}
.ing .q{font-family:var(--mono);font-size:13.5px;color:var(--gold2);white-space:nowrap}
/* a sub-recipe line is a full-width tappable row */
.subrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 11px 11px 13px;margin:5px 0;
  background:var(--surf2);border:1px solid var(--line2);border-radius:14px;transition:background .14s,border-color .14s}
.subrow:hover{background:var(--surf3);border-color:var(--gold)}
.subrow .n{flex:1;min-width:0;font-size:15px;color:var(--gold)}
.subrow .n small{display:block;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute2);font-weight:700;margin-top:2px}
.usedin{display:flex;flex-wrap:wrap;gap:7px}
.ub{padding:8px 13px;border-radius:999px;background:var(--surf2);border:1px solid var(--line);font-size:13px;color:var(--text)}
.ub:hover{border-color:var(--gold);color:var(--gold)}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.num{width:82px;padding:8px 10px;background:var(--surf2);border:1px solid var(--line);border-radius:12px;color:var(--text);font-family:var(--mono);font-size:13px;text-align:right}
.tx{padding:10px 13px;background:var(--surf2);border:1px solid var(--line);border-radius:12px;color:var(--text);font-size:14px}
.sel2{padding:8px 10px;background:var(--surf2);border:1px solid var(--line);border-radius:12px;color:var(--text);font-size:13px}
.gpill{padding:10px 18px;border-radius:999px;background:var(--gold);color:var(--goldink);font-weight:700;font-size:13px}
.gpill.ghost{background:transparent;border:1px solid var(--line2);color:var(--mute);font-weight:500}
.gpill.ghost:hover{color:var(--text);border-color:var(--mute)}
.gpill.sm{padding:7px 14px;font-size:12px}
.x{width:28px;height:28px;border-radius:50%;background:var(--surf3);color:#C0705E;font-size:14px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.mv{display:flex;flex-direction:column;gap:2px;flex:0 0 auto}
.mv button{width:28px;height:19px;border-radius:6px;background:var(--surf3);color:var(--mute);font-size:11px;
  line-height:1;display:flex;align-items:center;justify-content:center}
.mv button:hover:not([disabled]){background:var(--gold);color:var(--goldink)}
.mv button[disabled]{opacity:.25;cursor:not-allowed}
.ing.moved,.subrow.moved{animation:flash .55s ease-out}
@keyframes flash{from{background:rgba(233,167,60,.22)}to{background:transparent}}
.saved{font-family:var(--mono);font-size:11px;color:#7FB069;opacity:0;transition:opacity .2s}
.saved.on{opacity:1}
.note{font-size:12.5px;color:var(--mute);line-height:1.5;margin-top:10px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute2);font-weight:700;padding:0 8px 9px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 8px 9px 0;border-bottom:1px solid var(--line);font-size:14px}
.tbl tr:last-child td{border-bottom:0}
.card h3{font-family:var(--disp);font-size:25px;font-weight:600;margin:0 0 5px;line-height:1.15}
.card p{margin:0 0 14px;color:var(--mute);font-size:13.5px}
.link{color:var(--gold);text-decoration:none;border-bottom:1px solid rgba(233,167,60,.35)}
@media(min-width:560px){ .item .plate{width:70px;height:70px} }

  'Fish':['fish','salmon','tuna','otoro','hiramasa','unagi','eel','anchovy','bonito','dashi','suzuki','cod','swordfish','sashimi','tobiko','caviar'],
  'Crustaceans':['shrimp','prawn','ebi','lobster','crab','kani','surimi'],
  'Molluscs':['octopus','squid','calamari','clam','mussel','scallop','oyster'],
  'Soy':['soy','miso','tofu','edamame','hoisin','teriyaki','ponzu','gochujang','kikkoman','tamari','tosazu','tozasu'],
  'Gluten':['flour','panko','breadcrumb','bread','toast','brioche','noodle','ramen','soba','udon','tempura','soy sauce','beer','gyoza','wonton','crouton','wheat','batter'],
  'Egg':['egg','mayo','kewpie','aioli','tobiko','meringue','brioche','aquafaba'],
  'Milk':['milk','butter','cream','cheese','parmesan','mozzarella','yoghurt','yogurt'],
  'Sesame':['sesame','tahini','furikake','togarashi','gomashio'],
  'Peanuts':['peanut'],
  'Tree nuts':['almond','cashew','walnut','pistachio','hazelnut','pecan','macadamia'],
  'Sulphites':['wine','vinegar','mirin','sake'],
  'Celery':['celery'],
  'Mustard':['mustard','dijon'],
};
function suggestAllergens(i,seen){
  seen=seen||new Set(); if(seen.has(i)) return []; seen.add(i);
  const out=new Set();
  for(const r of rows(i)){
    if(r[0]===1&&RECS[r[1]]){ suggestAllergens(r[1],seen).forEach(a=>out.add(a)); continue; }
    const n=rowName(r).toLowerCase();
    for(const a in ALLERGEN_WORDS) if(ALLERGEN_WORDS[a].some(w=>n.includes(w))) out.add(a);
  }
  return [...out].sort();
}

/* which recipes call this sub-recipe */
function usedIn(si){ return RECS.map((r,i)=>i).filter(i=>i!==si && !isDead(i) && rows(i).some(r=>r[0]===1&&r[1]===si)); }

/* ---------- boot ---------- */
(async function(){
  LOCAL_OV=(await sget(K.ov))||{};
  LOCAL_CUSTOM=(await sget(K.custom))||[];
  LOCAL_META=(await sget(K.meta))||{};
  try{
    const res=await fetch('shared.json',{cache:'no-cache'});
    if(res.ok){ const j=await res.json();
      SHARED={ov:j.ov||{}, custom:Array.isArray(j.custom)?j.custom:[], meta:j.meta||{}}; }
  }catch(e){ /* nothing published yet, or offline */ }
  SHARED_N=SHARED.custom.length;
  ST.ov =Object.assign({},SHARED.ov,LOCAL_OV);
  META  =Object.assign({},SHARED.meta,LOCAL_META);
  CUSTOM=SHARED.custom.concat(LOCAL_CUSTOM);
  CUSTOM.forEach(c=>RECS.push([c.name, SECS.indexOf(c.sec)>=0?SECS.indexOf(c.sec):SECS.length-1, c.sub, c.rows]));
  READY=true;
  const b=document.getElementById('lbtn'); b.disabled=false; b.textContent='Sign in';

  // still signed in from last time? the list in the file decides, not the stored copy
  const sess=await sget(K.session);
  const back=sess&&sess.u ? USERS.find(x=>String(x.u).toLowerCase()===String(sess.u).toLowerCase()) : null;
  if(back){ enter(back); return; }
  document.getElementById('login').classList.add('show');
  document.getElementById('lu').focus();
})();
document.getElementById('lbtn').onclick=signIn;
document.getElementById('lp').addEventListener('keydown',e=>{ if(e.key==='Enter') signIn(); });
function signIn(){
  if(!READY) return;
  const u=document.getElementById('lu').value.trim().toLowerCase(), p=document.getElementById('lp').value;
  const hit=USERS.find(x=>String(x.u).toLowerCase()===u&&String(x.p)===p);
  if(!hit){ document.getElementById('lerr').textContent='That user name and PIN don\u2019t match. Try again.'; return; }
  sset(K.session,{u:hit.u});          // stay signed in across refreshes
  enter(hit);
}
function enter(hit){
  ME=hit;
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='flex';
  const a=document.getElementById('av'); a.textContent=hit.u.slice(0,2).toUpperCase(); a.title=hit.u+' \u00B7 '+hit.role;
  document.getElementById('menu').innerHTML=
    `<div class="who"><b>${esc(hit.u)}</b>${hit.role==='admin'?'Admin \u00B7 can edit recipes':'Chef \u00B7 read only'}</div>
     <button class="out" onclick="logout()">Sign out</button>`;
  render();
}

/* ---------- navigation ----------
   open() pushes the current view onto a stack, so Back from a sub-recipe
   returns to the dish you opened it from, however deep you went. */
window.toggleMenu=e=>{ e.stopPropagation();
  const on=document.getElementById('menu').classList.toggle('on');
  document.getElementById('menubg').classList.toggle('on',on); };
window.closeMenu=()=>{ document.getElementById('menu').classList.remove('on');
  document.getElementById('menubg').classList.remove('on'); };
document.addEventListener('click',e=>{
  const m=document.getElementById('menu');
  if(m && m.classList.contains('on') && !m.contains(e.target) && e.target.id!=='av') closeMenu();
});
window.logout=()=>{
  sset(K.session,null);
  ME=null; STACK=[]; VIEW={t:'lib'}; Q=''; FILT='all'; SCROLL=0; ADD={type:'ing',sel:null,newName:'',q:''};
  closeMenu();
  document.getElementById('app').style.display='none';
  document.getElementById('main').innerHTML='';
  document.getElementById('login').style.display='flex';
  document.getElementById('login').classList.add('show');
  document.getElementById('lp').value=''; document.getElementById('lerr').textContent='';
  document.getElementById('lu').focus();
  window.scrollTo(0,0);
};

function render(){
  const tabs=[['lib','Recipes'],['menu','Menu check']];
  if(ME.role==='admin') tabs.push(['users','Users']);
  document.getElementById('segs').innerHTML=tabs.map(t=>
    `<button class="seg ${VIEW.t===t[0]?'on':''}" onclick="tab('${t[0]}')">${t[1]}</button>`).join('');
  const m=document.getElementById('main');
  if(VIEW.t==='lib') m.innerHTML=library();
  else if(VIEW.t==='rec') m.innerHTML=sheet(VIEW.i);
  else if(VIEW.t==='new') m.innerHTML=newRecipe();
  else if(VIEW.t==='menu') m.innerHTML=menucheck();
  else if(VIEW.t==='users') m.innerHTML=users();
  if(VIEW.t!=='rec') m.insertAdjacentHTML('beforeend', acctRow());
  window.scrollTo(0, VIEW.t==='lib' ? SCROLL : 0);
}
function acctRow(){
  return `<div class="acct">
    <div class="who2">Signed in as <b>${esc(ME.u)}</b> \u00B7 ${ME.role==='admin'?'Admin':'Chef'}</div>
    <button class="signout" onclick="logout()">Sign out</button>
  </div>`;
}
function open_(t,i){
  if(VIEW.t==='lib') SCROLL=window.scrollY;
  STACK.push({...VIEW});
  VIEW={t,i};
  render();
}
function back(){
  VIEW = STACK.length ? STACK.pop() : {t:'lib'};
  render();
}
function tab(t){ STACK=[]; VIEW={t}; render(); }
window.open_=open_; window.back=back; window.tab=tab;
function backLabel(){
  const p=STACK[STACK.length-1];
  if(!p) return 'Recipes';
  if(p.t==='rec') return NAME(p.i);
  if(p.t==='menu') return 'Menu check';
  return 'Recipes';
}

/* ---------- library ---------- */
const QUICK=[['all','All'],['dish','Dishes'],['sub','Sub-recipes'],['onmenu','On the menu']];
function library(){
  const q=Q.toLowerCase().trim();
  const list=RECS.map((r,i)=>i).filter(i=>{
    if(isDead(i)) return false;
    if(FILT==='sub'&&!ISSUB(i)) return false;
    if(FILT==='dish'&&ISSUB(i)) return false;
    if(FILT==='onmenu'&&!ONMENU(i)) return false;
    if(!['all','sub','dish','onmenu'].includes(FILT)&&SEC(i)!==FILT) return false;
    if(!q) return true;
    if(NAME(i).toLowerCase().includes(q)) return true;
    return rows(i).some(r=>rowName(r).toLowerCase().includes(q));
  });
  const opts=['<option value="all">All sections</option>']
    .concat(SECS.map(s=>`<option value="${esc(s)}" ${FILT===s?'selected':''}>${esc(s)}</option>`)).join('');
  return `
  ${ME.role==='admin'?`<button class="gpill" style="width:100%;margin-bottom:12px;padding:13px"
     onclick="newForm()">+ New recipe</button>`:''}
  <div class="srow">
    <input class="inp" id="q" placeholder="Search a dish, sauce or ingredient" value="${esc(Q)}">
    <select class="sel" id="f">${opts}</select>
  </div>
  <div class="quick">${QUICK.map(k=>
    `<button class="qb ${FILT===k[0]?'on':''}" onclick="setFilt('${k[0]}')">${k[1]}</button>`).join('')}</div>
  <div class="count">${list.length} of ${RECS.length} recipes</div>
  ${list.length?`<div class="list">${list.map(i=>itemHTML(i,q)).join('')}</div>`
    :`<div class="empty">Nothing matches \u201C${esc(Q)}\u201D. Try an ingredient name, or tap All.</div>`}
`;
}
window.setFilt=f=>{ FILT=f; SCROLL=0; render(); };
function itemHTML(i,q){
  let hit='';
  if(q && !NAME(i).toLowerCase().includes(q)){
    const m=rows(i).map(rowName).filter(n=>n.toLowerCase().includes(q));
    if(m.length) hit=`<div class="hit">contains ${esc(m.slice(0,2).join(', '))}${m.length>2?` +${m.length-2}`:''}</div>`;
  }
  const subs=rows(i).filter(r=>r[0]===1).length;
  return `<button class="item" onclick="open_('rec',${i})">
    ${plate(i)}
    <div class="body">
      <div class="nm">${esc(NAME(i))}</div>
      <div class="sub"><span class="chip ${ISSUB(i)?'':'g'}">${esc(ISSUB(i)?'Sub-recipe':SEC(i))}</span>
        <span>${rows(i).length} items</span>
        ${subs?`<span style="color:var(--gold)">${subs} sub</span>`:''}
        ${ONMENU(i)?'<span class="chip live">on menu</span>':''}</div>
      ${hit}
    </div>
    <div class="chev">\u203A</div></button>`;
}
document.addEventListener('input',e=>{
  if(e.target.id==='q'){ Q=e.target.value; SCROLL=0;
    document.getElementById('main').innerHTML=library()+acctRow();
    const el=document.getElementById('q'); el.focus(); el.setSelectionRange(el.value.length,el.value.length); }
});
document.addEventListener('change',e=>{ if(e.target.id==='f'){ FILT=e.target.value; SCROLL=0; render(); } });

/* ---------- recipe sheet ---------- */
function sheet(i){
  const isSub=ISSUB(i), rs=rows(i), admin=ME.role==='admin', ed=admin&&!!VIEW.edit;
  const m=meta(i), subRows=rs.filter(r=>r[0]===1).length, parents=usedIn(i);
  const sc=VIEW.scale||1;
  const steps=Array.isArray(m.method)?m.method:[];
  const allerg=Array.isArray(m.allergens)?m.allergens:[];
  const qfmt=q=>(Math.round(((Number(q)||0)*sc)*100)/100).toString();

  const lines=rs.map((r,n)=>{
    const nm=rowName(r), u=rowUnit(r);
    const qcell=ed
      ? `<input class="num" value="${r[3]}" onchange="setQty(${i},${n},this.value)">
         <select class="sel2" onchange="setUnit(${i},${n},this.value)">${UNITS.map(x=>`<option ${x===u?'selected':''}>${x}</option>`).join('')}</select>`
      : `<span class="q">${qfmt(r[3])} ${u}</span>`;
    const move=ed?`<div class="mv">
      <button onclick="moveRow(${i},${n},-1)" ${n===0?'disabled':''}>\u25B2</button>
      <button onclick="moveRow(${i},${n},1)" ${n===rs.length-1?'disabled':''}>\u25BC</button></div>`:'';
    const del=ed?`<button class="x" onclick="askDelRow(${n})" title="Remove this line">\u00D7</button>`:'';
    if(ed && VIEW.confirmRow===n){
      return `<div class="ing confirmrow">
        <div class="n">Remove <b>${esc(nm)}</b> from this recipe?</div>
        <button class="gpill sm" onclick="delRow(${i},${n})">Remove</button>
        <button class="gpill ghost sm" onclick="cancelDelRow()">Keep</button></div>`;
    }
    const hi=(VIEW.moved===n)?' moved':'';
    if(r[0]===1&&RECS[r[1]]){
      return `<div class="subrow${hi}">
        <div class="n" onclick="open_('rec',${r[1]})" style="cursor:pointer">${esc(nm)}<small>${ISSUB(r[1])?'Sub-recipe':'Made from another sheet'} \u00B7 tap to open</small></div>
        ${qcell}${move}${del}${ed?'':`<div class="chev" onclick="open_('rec',${r[1]})" style="cursor:pointer">\u203A</div>`}</div>`;
    }
    return `<div class="ing${hi}"><div class="n">${esc(nm)}</div>${qcell}${move}${del}</div>`;
  }).join('');

  return `
  <button class="back" onclick="back()">\u2190 ${esc(backLabel())}</button>

  <div class="hero">
    ${plate(i)}
    <h2>${esc(NAME(i))}</h2>
    <div class="meta">
      <span class="chip ${isSub?'':'g'}">${esc(isSub?'Sub-recipe':SEC(i))}</span>
      ${m.yield?`<span>${esc(m.yield)}</span>`:`<span style="color:var(--mute2)">yield not set</span>`}
      ${ONMENU(i)?'<span class="chip live">on the menu</span>':''}
    </div>
    <div class="allerg">${allerg.length?allerg.map(a=>`<span class="al">${esc(a)}</span>`).join('')
      :'<span class="al none">Allergens not recorded</span>'}</div>
  </div>

  <div class="card">
    <div class="ch">Ingredients</div>
    <div class="chn">${rs.length?`${rs.length} lines${subRows?` \u00B7 ${subRows} made in-house`:''}`:'Nothing added yet.'}</div>
    ${ed?'':`<div class="scaler">
      ${[1,2,4].map(x=>`<button class="sb ${sc===x?'on':''}" onclick="setScale(${x})">${x}\u00D7</button>`).join('')}
      <input class="sci" type="number" min="0.25" step="0.25" placeholder="custom"
        value="${[1,2,4].includes(sc)?'':sc}" oninput="setScale(this.value)">
      ${sc!==1?`<span class="chip g">\u00D7${sc}</span>`:''}
    </div>`}
    ${lines}
    ${ed?addPanel(i):''}
  </div>

  <div class="card">
    <div class="ch">Method</div>
    ${steps.length?`<ol class="steps">${steps.map(t=>`<li>${esc(t)}</li>`).join('')}</ol>`
      :`<div class="chn" style="margin:0">No method written yet.${admin?' Use Edit details below.':''}</div>`}
  </div>

  <div class="card">
    <div class="ch">Plating &amp; garnish</div>
    <div class="chn" style="margin:0">${m.plating?esc(m.plating):'Not recorded.'}</div>
    <div class="ch" style="margin-top:17px">Chef\u2019s notes</div>
    <div class="chn" style="margin:0">${m.notes?esc(m.notes):'Not recorded.'}</div>
  </div>

  ${parents.length?`<div class="card">
    <div class="ch">Used in</div>
    <div class="chn">${parents.length} recipe${parents.length>1?'s':''} call this</div>
    <div class="usedin">${parents.map(p=>`<button class="ub" onclick="open_('rec',${p})">${esc(NAME(p))}</button>`).join('')}</div>
  </div>`:''}

  ${admin?adminCard(i,ed,isSub,m,allerg,steps):''}`;
}

function adminCard(i,ed,isSub,m,allerg,steps){
  const missing=suggestAllergens(i).filter(a=>!allerg.includes(a));
  return `<div class="card">
    <div class="ch">Edit</div>
    <div class="chn">${isCustom(i)?'Added in the app.':'From the original recipe files.'}
      Changes stay on this device until you publish them.</div>
    <div class="row">
      <button class="gpill sm" onclick="toggleEdit()">${ed?'Done with ingredients':'Edit ingredients'}</button>
      <button class="gpill ghost sm" onclick="toggleDetails()">${VIEW.details?'Close details':'Edit details'}</button>
      ${(!isCustom(i)&&ST.ov[i]&&ST.ov[i].rows)?`<button class="gpill ghost sm" onclick="resetRec(${i})">Restore original</button>`:''}
      <span class="saved" id="sv">Saved</span>
    </div>
    ${VIEW.details?`
    <div class="fset">
      <label class="first">Photo</label>
      <div class="row">
        <label class="gpill ghost sm" style="cursor:pointer">Choose a photo
          <input type="file" accept="image/*" style="display:none" onchange="uploadPhoto(${i},this)"></label>
        ${m.img?`<button class="gpill ghost sm" onclick="setPhoto(${i},'')">Remove</button>`:''}
        <span class="chip" id="phmsg">${m.img?Math.round(m.img.length/1024)+' KB':''}</span>
      </div>
      <div class="hint2">From the camera or the gallery. Shrunk automatically so the app stays quick.</div>

      <label>Yield / portion size</label>
      <input class="tx w" value="${esc(m.yield||'')}" placeholder="e.g. 1 portion, 220 g"
        onchange="setMeta(${i},'yield',this.value)">

      <label>Allergens</label>
      <input class="tx w" value="${esc(allerg.join(', '))}" placeholder="comma separated"
        onchange="setMetaList(${i},'allergens',this.value)">
      ${missing.length?`<div class="sugbox">
        <b>Seen in the ingredient names:</b> ${missing.map(esc).join(', ')}.
        <button class="gpill ghost sm" style="margin-top:8px" onclick="applyAllergens(${i})">Add these</button>
        <div class="hint2" style="margin-top:7px">This only reads ingredient names. It cannot see allergens hidden
          inside bought products. Check every one against the actual labels before anyone relies on it.</div>
      </div>`:''}

      <label>Method \u2014 one step per line</label>
      <textarea class="tx w" rows="7" placeholder="Season the beef&#10;Sear 90 seconds each side&#10;Rest 4 minutes"
        onchange="setMetaLines(${i},'method',this.value)">${esc(steps.join('\n'))}</textarea>

      <label>Plating &amp; garnish</label>
      <textarea class="tx w" rows="3" onchange="setMeta(${i},'plating',this.value)">${esc(m.plating||'')}</textarea>

      <label>Chef\u2019s notes</label>
      <textarea class="tx w" rows="3" onchange="setMeta(${i},'notes',this.value)">${esc(m.notes||'')}</textarea>

      ${isCustom(i)?`<label>Name and section</label>
      <div class="row">
        <input class="tx" style="flex:1;min-width:140px" value="${esc(NAME(i))}" onchange="renameRecipe(${i},this.value)">
        ${!isSub?`<select class="sel2" onchange="resectionRecipe(${i},this.value)">
          ${SECS.filter(x=>x!=='Sub-Recipes').map(x=>`<option ${SEC(i)===x?'selected':''}>${esc(x)}</option>`).join('')}
          </select>`:''}
      </div>`:''}

      <label>Delete</label>
      <button class="gpill ghost sm" onclick="deleteRecipe(${i})">Delete this recipe</button>
      <div id="delmsg"></div>
      <div class="hint2">${isCustom(i)?'This one was added in the app, so deleting it is permanent.'
        :'This came from your recipe files. Deleting hides it \u2014 you can bring it back from the Users tab.'}</div>
    </div>`:''}
  </div>`;
}

/* ---------- add a line: pick a type, then pick from that list ---------- */
let ADD={type:'ing', sel:null, newName:'', q:''};
function addPanel(i){
  return `<div class="addbox">
    <div class="ch">Add a line</div>
    <div class="chn">Choose what you are adding, then pick it from the list.</div>
    <div class="row" style="margin-bottom:10px">
      <button class="qb ${ADD.type==='ing'?'on':''}" onclick="addType('ing')">Ingredient</button>
      <button class="qb ${ADD.type==='sub'?'on':''}" onclick="addType('sub')">Sub-recipe</button>
    </div>
    <input class="tx" id="aq" style="width:100%" autocomplete="off"
      placeholder="${ADD.type==='sub'?'Search the 64 sub-recipes':'Search the ingredient list'}"
      value="${esc(ADD.q)}" oninput="addSearch(this.value)">
    <div class="picklist" id="addlist">${pickList()}</div>
    <div class="row" style="margin-top:11px">
      <input class="num" id="nq" placeholder="Qty">
      <select class="sel2" id="nu">${UNITS.map(u=>`<option ${u==='g'?'selected':''}>${u}</option>`).join('')}</select>
      <button class="gpill sm" id="addbtn" onclick="addRow(${i})" ${(ADD.sel===null&&!ADD.newName)?'disabled':''}>Add line</button>
    </div>
  </div>`;
}
function pickList(){
  const q=ADD.q.trim().toLowerCase();
  let out='';
  if(ADD.type==='sub'){
    const list=RECS.map((r,n)=>n).filter(n=>ISSUB(n)&&!isDead(n)&&(!q||NAME(n).toLowerCase().includes(q)));
    if(!list.length) return '<div class="picknone">No sub-recipe matches that.</div>';
    out=list.slice(0,60).map(n=>`<button class="pick ${ADD.sel===n?'on':''}" onclick="pickIt(${n})">${esc(NAME(n))}
      <small>${rows(n).length} items</small></button>`).join('');
  }else{
    const list=INGS.map((n,k)=>k).filter(k=>!q||INGS[k].toLowerCase().includes(q))
      .sort((a,b)=>INGS[a].localeCompare(INGS[b]));
    const exact=list.some(k=>INGS[k].toLowerCase()===q);
    if(q&&!exact) out+=`<button class="pick new ${ADD.newName?'on':''}" onclick="pickNew()">
      Add \u201C${esc(ADD.q.trim())}\u201D as a new ingredient<small>not in the list yet</small></button>`;
    out+=list.slice(0,60).map(k=>`<button class="pick ${ADD.sel===k&&!ADD.newName?'on':''}" onclick="pickIt(${k})">${esc(INGS[k])}</button>`).join('');
    if(!out) return '<div class="picknone">Nothing matches.</div>';
  }
  return out;
}
window.addType=t=>{ ADD={type:t,sel:null,newName:'',q:''}; render(); };
function refreshPicks(enable){
  const l=document.getElementById('addlist'); if(!l) return;
  l.innerHTML=pickList();
  const b=document.getElementById('addbtn'); if(b) b.disabled=!enable;
}
window.addSearch=v=>{ ADD.q=v; ADD.sel=null; ADD.newName=''; refreshPicks(false); };
window.pickIt=n=>{ ADD.sel=n; ADD.newName=''; refreshPicks(true); };
window.pickNew=()=>{ ADD.newName=ADD.q.trim(); ADD.sel=null; refreshPicks(true); };

window.setScale=v=>{ const n=Number(v); VIEW.scale=(n&&n>0)?n:1; render(); };
window.toggleDetails=()=>{ VIEW.details=!VIEW.details; render(); };
function flashSaved(){ const el=document.getElementById('sv');
  if(el){ el.classList.add('on'); setTimeout(()=>el.classList.remove('on'),1200); } }
window.setMeta=async(i,f,v)=>{ setMetaField(i,f,String(v||'').trim()); await saveMeta(); flashSaved(); };
window.setMetaList=async(i,f,v)=>{
  setMetaField(i,f,String(v||'').split(',').map(x=>x.trim()).filter(Boolean)); await saveMeta(); render(); };
window.setMetaLines=async(i,f,v)=>{
  setMetaField(i,f,String(v||'').split('\n').map(x=>x.trim()).filter(Boolean)); await saveMeta(); flashSaved(); };
window.applyAllergens=async i=>{
  const cur=Array.isArray(meta(i).allergens)?meta(i).allergens:[];
  setMetaField(i,'allergens',[...new Set([...cur,...suggestAllergens(i)])].sort());
  await saveMeta(); render(); };
window.setPhoto=async(i,dataUrl)=>{ setMetaField(i,'img',dataUrl||''); await saveMeta(); render(); };
window.uploadPhoto=(i,inp)=>{
  const f=inp.files&&inp.files[0]; if(!f) return;
  const msg=document.getElementById('phmsg'); if(msg) msg.textContent='working\u2026';
  const rd=new FileReader();
  rd.onload=()=>{
    const img=new Image();
    img.onload=async()=>{
      const MAX=640, k=Math.min(1,MAX/Math.max(img.width,img.height));
      const w=Math.round(img.width*k), h=Math.round(img.height*k);
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      let out=cv.toDataURL('image/jpeg',0.62);
      if(out.length>140000) out=cv.toDataURL('image/jpeg',0.45);
      await setPhoto(i,out);
    };
    img.onerror=()=>{ if(msg) msg.textContent='could not read that image'; };
    img.src=rd.result;
  };
  rd.onerror=()=>{ if(msg) msg.textContent='could not read that file'; };
  rd.readAsDataURL(f);
  inp.value='';
};

window.toggleEdit=()=>{ ADD={type:'ing',sel:null,newName:'',q:''}; VIEW.confirmRow=null; VIEW.edit=!VIEW.edit; render(); };
function ensure(i){ editRows(i); }
async function saveCustom(){ LOCAL_CUSTOM=CUSTOM.slice(SHARED_N); return sset(K.custom, LOCAL_CUSTOM); }
async function save(){ const ok=await sset(K.ov,LOCAL_OV) && await saveCustom(); const el=document.getElementById('sv');
  if(el){ el.textContent=ok?'Saved':'Saved for this session only'; el.classList.add('on'); setTimeout(()=>el.classList.remove('on'),1400); } }
window.setQty=async(i,n,v)=>{ editRows(i)[n][3]=Number(v)||0; await save(); render(); };
window.setUnit=async(i,n,v)=>{ editRows(i)[n][2]=UNITS.indexOf(v); await save(); render(); };
window.askDelRow=n=>{ VIEW.confirmRow=n; render(); };
window.cancelDelRow=()=>{ VIEW.confirmRow=null; render(); };
window.delRow=async(i,n)=>{ editRows(i).splice(n,1); VIEW.confirmRow=null; await save(); render(); };
window.moveRow=async(i,n,dir)=>{
  const to=n+dir;
  const rs=editRows(i);
  if(to<0||to>=rs.length) return;
  [rs[n],rs[to]]=[rs[to],rs[n]];
  await save();
  VIEW.moved=to; render(); VIEW.moved=null;
};
window.addRow=async i=>{
  const uEl=document.getElementById('nu'), qEl=document.getElementById('nq');
  if(!uEl) return;
  const u=uEl.value, q=Number(qEl.value)||0;
  const rs=editRows(i);
  if(ADD.newName){ INGS.push(ADD.newName); rs.push([0,INGS.length-1,UNITS.indexOf(u),q]); }
  else if(ADD.sel===null) return;
  else if(ADD.type==='sub'){
    if(ADD.sel===i) return;                       // a recipe cannot contain itself
    rs.push([1,ADD.sel,UNITS.indexOf(u),q]);
  }
  else rs.push([0,ADD.sel,UNITS.indexOf(u),q]);
  ADD={type:ADD.type,sel:null,newName:'',q:''};
  await save(); render();
};
window.setImg=async(i,v)=>{ if(!ST.ov[i]) ST.ov[i]={}; ST.ov[i].img=String(v||'').trim(); await save(); render(); };
window.resetRec=async i=>{ if(ST.ov[i]){ delete ST.ov[i].rows; if(!Object.keys(ST.ov[i]).length) delete ST.ov[i]; }
  await save(); VIEW.edit=false; render(); };

/* ---------- new recipe ---------- */
let NEW={name:'', kind:'dish', sec:SECS[0]};
window.newForm=()=>{ NEW={name:'',kind:'dish',sec:SECS[0]}; open_('new'); };
window.newKind=k=>{ NEW.kind=k; render(); };
window.newField=(f,v)=>{ NEW[f]=v; const b=document.getElementById('crt'); if(b) b.disabled=!NEW.name.trim(); };
function newRecipe(){
  const secs=SECS.filter(x=>x!=='Sub-Recipes');
  return `
  <button class="back" onclick="back()">\u2190 ${esc(backLabel())}</button>
  <div class="card">
    <h3>New recipe</h3>
    <p>Give it a name and say what it is. You add the ingredients on the next screen.</p>
    <div class="ch">What is it</div>
    <div class="row" style="margin-bottom:14px">
      <button class="qb ${NEW.kind==='dish'?'on':''}" onclick="newKind('dish')">A dish</button>
      <button class="qb ${NEW.kind==='sub'?'on':''}" onclick="newKind('sub')">A sub-recipe</button>
    </div>
    <div class="ch">Name</div>
    <input class="tx" id="nn" style="width:100%;margin-bottom:14px" value="${esc(NEW.name)}"
      placeholder="${NEW.kind==='sub'?'e.g. Yuzu Kosho Butter':'e.g. Miso Black Cod'}"
      oninput="newField('name',this.value)">
    ${NEW.kind==='dish'?`<div class="ch">Menu section</div>
      <select class="sel2" style="width:100%;margin-bottom:14px" onchange="newField('sec',this.value)">
        ${secs.map(x=>`<option ${NEW.sec===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`:''}
    <button class="gpill" id="crt" style="width:100%;padding:13px" onclick="createRecipe()"
      ${NEW.name.trim()?'':'disabled'}>Create and add ingredients</button>
    <div class="note">A sub-recipe is a prep you make in-house and use inside other dishes \u2014 a sauce,
      a marinade, a pickle. It can then be linked from any recipe.</div>
  </div>`;
}
window.createRecipe=async()=>{
  const name=(document.getElementById('nn').value||'').trim();
  if(!name) return;
  const sub=NEW.kind==='sub'?1:0;
  const sec=sub?'Sub-Recipes':NEW.sec;
  CUSTOM.push({name, sec, sub, rows:[], del:false});
  const c=CUSTOM[CUSTOM.length-1];
  RECS.push([c.name, SECS.indexOf(sec), sub, c.rows]);
  const idx=RECS.length-1;
  await saveCustom();
  STACK=[{t:'lib'}];
  VIEW={t:'rec', i:idx, edit:true};
  ADD={type:'ing',sel:null,newName:'',q:''};
  render();
};
window.renameRecipe=async(i,v)=>{
  v=(v||'').trim(); if(!v||!isCustom(i)) return;
  cust(i).name=v; RECS[i][0]=v; await saveCustom(); render();
};
window.resectionRecipe=async(i,v)=>{
  if(!isCustom(i)) return;
  cust(i).sec=v; RECS[i][1]=SECS.indexOf(v); await saveCustom(); render();
};
window.deleteRecipe=async i=>{
  const box=document.getElementById('delmsg');
  const used=usedIn(i);
  if(used.length){
    VIEW.confirmDel=false;
    box.innerHTML=`<div class="dangerbox">Not yet \u2014 <b>${esc(NAME(i))}</b> is used inside
      ${used.map(u=>esc(NAME(u))).join(', ')}. Take it out of those first, or they will point at nothing.</div>`;
    return;
  }
  if(!VIEW.confirmDel){
    VIEW.confirmDel=true;
    box.innerHTML=`<div class="dangerbox">
      Delete <b>${esc(NAME(i))}</b>?<br>
      ${isCustom(i)?'It was added in the app, so this cannot be undone.'
        :'It came from your recipe files, so it is only hidden and can be restored later.'}
      <div class="row" style="margin-top:10px">
        <button class="gpill sm" onclick="deleteRecipe(${i})">Yes, delete</button>
        <button class="gpill ghost sm" onclick="cancelDelete()">Cancel</button>
      </div></div>`;
    return;
  }
  if(isCustom(i)){ cust(i).del=true; cust(i).rows=[]; await saveCustom(); }
  else { setMetaField(i,'del',true); await saveMeta(); }
  VIEW.confirmDel=false; VIEW.details=false; VIEW.edit=false;
  STACK=[]; VIEW={t:'lib'}; render();
};
window.cancelDelete=()=>{ VIEW.confirmDel=false; render(); };
window.restoreRecipe=async i=>{
  if(isCustom(i)){ if(cust(i)) cust(i).del=false; await saveCustom(); }
  else { setMetaField(i,'del',false); await saveMeta(); }
  render();
};

/* ---------- users ---------- */
function users(){
  return `
  <div class="card">
    <h3>Who can sign in</h3>
    <p>This list lives inside the app file, so it is the same on every phone, tablet and browser.
       Adding someone means editing that file once \u2014 not tapping a button on one device.</p>
    <table class="tbl"><thead><tr><th>User</th><th style="width:80px">PIN</th><th style="width:90px">Role</th></tr></thead>
    <tbody>${USERS.map(u=>`<tr><td>${esc(u.u)}${u.u===ME.u?' <span style="color:var(--mute2);font-size:11px">\u2014 you</span>':''}</td>
      <td style="font-family:var(--mono);font-size:13px;color:var(--mute)">${esc(String(u.p))}</td>
      <td style="color:var(--mute);font-size:13px">${u.role==='admin'?'Admin':'Chef'}</td></tr>`).join('')}</tbody></table>
  </div>

  <div class="card">
    <div class="ch">Add someone</div>
    <div class="chn">Fill this in, copy the line, and paste it into the app file on GitHub.</div>
    <div class="row">
      <input class="tx" id="nu1" placeholder="User name" style="flex:1;min-width:120px" oninput="lineOut()">
      <input class="tx" id="np1" placeholder="PIN" style="width:90px" oninput="lineOut()">
      <select class="sel2" id="nr1" onchange="lineOut()"><option value="chef">Chef</option><option value="admin">Admin</option></select>
    </div>
    <input class="tx" id="uline" readonly style="width:100%;margin-top:11px;font-family:var(--mono);font-size:12.5px"
      value="fill in a name and a PIN">
    <div class="row" style="margin-top:10px">
      <button class="gpill sm" onclick="copyLine()">Copy the line</button>
      <span class="saved" id="cpd">Copied</span>
    </div>
    <div class="note">Then on GitHub: open <b>index.html</b>, click the pencil, search for
      <b>WHO CAN SIGN IN</b>, paste the line under the last one, and commit. Everyone gets it within a minute.</div>
  </div>

  ${(()=>{ const hid=RECS.map((r,i)=>i).filter(isDead);
    return hid.length?`<div class="card">
      <div class="ch">Deleted recipes \u2014 ${hid.length}</div>
      <div class="chn">Hidden from everyone. The ones from your recipe files can be brought back.</div>
      <table class="tbl"><tbody>${hid.map(i=>`<tr>
        <td>${esc(RECS[i][0])}<div style="color:var(--mute2);font-size:11.5px">${esc(SECS[RECS[i][1]])}</div></td>
        <td style="text-align:right">${isCustom(i)?'<span class="chip">added in app</span>'
          :`<button class="gpill ghost sm" onclick="restoreRecipe(${i})">Restore</button>`}</td></tr>`).join('')}</tbody></table>
    </div>`:''; })()}

  <div class="card">
    <div class="ch">Publish to everyone</div>
    <div class="chn">Photos, method steps and edits sit on this device until you publish.
      Publishing writes one file you upload to GitHub, and every phone then gets it.</div>
    <div class="row">
      <button class="gpill sm" onclick="publish()">Publish\u2026</button>
      <label class="gpill ghost sm" style="cursor:pointer">Load a file
        <input type="file" accept="application/json,.json" style="display:none" onchange="importData(this)"></label>
      <button class="gpill ghost sm" onclick="revertLocal()">Discard unpublished</button>
    </div>
    <div id="iomsg"></div>
    <div class="note">Not yet published on this device: ${Object.keys(LOCAL_OV).length} edited,
      ${LOCAL_CUSTOM.filter(c=>!c.del).length} added, ${Object.keys(LOCAL_META).length} with details or photos.</div>
  </div>`;
}
window.publish=()=>{
  const txt=JSON.stringify({v:2, at:new Date().toISOString(), ov:ST.ov, custom:CUSTOM, meta:META});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));
  a.download='shared.json'; a.click();
  document.getElementById('iomsg').innerHTML=`<div class="warnbox" style="margin-top:11px">
    <b>shared.json saved \u2014 ${Math.round(txt.length/1024)} KB.</b><br>
    Upload it to GitHub in the same folder as index.html and commit.
    Every device picks it up next time it opens.<br><br>
    Once it is up there, tap <b>Discard unpublished</b> so this device follows the published copy too.</div>`;
};
window.revertLocal=async()=>{
  if(!VIEW.confirmRevert){ VIEW.confirmRevert=true;
    document.getElementById('iomsg').innerHTML=`<div class="warnbox" style="margin-top:11px">
      Throw away everything on this device that has not been published?
      <button class="gpill sm" style="margin-left:8px" onclick="revertLocal()">Yes, discard</button>
      <button class="gpill ghost sm" onclick="VIEW.confirmRevert=false;render()">Cancel</button></div>`;
    return; }
  LOCAL_OV={}; LOCAL_META={}; LOCAL_CUSTOM=[];
  await sset(K.ov,{}); await sset(K.meta,{}); await sset(K.custom,[]);
  ST.ov=Object.assign({},SHARED.ov);
  META =Object.assign({},SHARED.meta);
  RECS.length=BASE_N; CUSTOM=SHARED.custom.slice();
  CUSTOM.forEach(c=>RECS.push([c.name, SECS.indexOf(c.sec)>=0?SECS.indexOf(c.sec):SECS.length-1, c.sub, c.rows]));
  VIEW.confirmRevert=false; STACK=[]; VIEW={t:'lib'}; render();
};
window.lineOut=()=>{
  const u=document.getElementById('nu1').value.trim(), p=document.getElementById('np1').value.trim(),
        r=document.getElementById('nr1').value;
  document.getElementById('uline').value = (u&&p)
    ? `  { u:'${u.replace(/'/g,"")}', p:'${p.replace(/'/g,"")}', role:'${r}' },`
    : 'fill in a name and a PIN';
};
window.copyLine=async()=>{
  const el=document.getElementById('uline');
  el.select(); el.setSelectionRange(0,999);
  try{ await navigator.clipboard.writeText(el.value); }catch(e){ try{ document.execCommand('copy'); }catch(e2){} }
  const c=document.getElementById('cpd'); c.classList.add('on'); setTimeout(()=>c.classList.remove('on'),1400);
};
window.importData=inp=>{
  const f=inp.files&&inp.files[0]; if(!f) return;
  const msg=document.getElementById('iomsg');
  const rd=new FileReader();
  rd.onload=async()=>{
    try{
      const data=JSON.parse(rd.result);
      if(typeof data!=='object'||(!data.ov&&!data.custom&&!data.meta)) throw new Error('not a BARTEN file');
      LOCAL_OV  =(data.ov  &&typeof data.ov  ==='object')?data.ov  :{};
      LOCAL_META=(data.meta&&typeof data.meta==='object')?data.meta:{};
      LOCAL_CUSTOM=Array.isArray(data.custom)?data.custom.slice(SHARED_N):[];
      ST.ov=Object.assign({},SHARED.ov,LOCAL_OV);
      META =Object.assign({},SHARED.meta,LOCAL_META);
      RECS.length=BASE_N;
      CUSTOM=SHARED.custom.concat(LOCAL_CUSTOM);
      CUSTOM.forEach(c=>RECS.push([c.name, SECS.indexOf(c.sec)>=0?SECS.indexOf(c.sec):SECS.length-1, c.sub, c.rows]));
      await sset(K.ov,LOCAL_OV); await sset(K.meta,LOCAL_META); await sset(K.custom,LOCAL_CUSTOM);
      msg.innerHTML=`<div class="warnbox" style="margin-top:11px">Loaded \u2014 ${CUSTOM.filter(c=>!c.del).length}
        added, ${Object.keys(META).length} with details.</div>`;
      STACK=[]; setTimeout(()=>{ VIEW={t:'lib'}; render(); },1200);
    }catch(e){
      msg.innerHTML=`<div class="warnbox" style="margin-top:11px">That file could not be read \u2014 ${esc(e.message)}.</div>`;
    }
  };
  rd.readAsText(f); inp.value='';
};

if('serviceWorker' in navigator && location.protocol==='https:'){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
